# Ubiación de la base de datos del reproductor.
db_file		"/home/lowu/.local/share/mpd/database"

# Ubiación de los archivos de música.
music_directory		"~/Música"

auto_update		"yes"
restore_paused 		"yes"
follow_outside_symlinks	"yes"
follow_inside_symlinks	"yes"

playlist_directory 	"/home/lowu/.local/share/mpd/playlists"
pid_file           	"/home/lowu/.local/share/mpd/pid"
state_file         	"/home/lowu/.local/share/mpd/state"
sticker_file       	"/home/lowu/.local/share/mpd/sticker.sql"

bind_to_address    "127.0.0.1"
port		   "6600"

audio_output {
    type	"pipewire"
    name 	"PipeWire Sound Server"	
}

audio_output {
    type                    "fifo"
    name                    "my_fifo"
    path                    "/tmp/mpd.fifo"
    format                  "44100:16:2"
}
