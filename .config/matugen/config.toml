[config.wallpaper]
command = "awww"
arguments = ["img", "--transition-type", "center", "--transition-fps", "60"]
set = true

[config]
# ...
[templates.kitty]
input_path = '/home/lowu/.config/matugen/templates/kitty-colors.conf'
output_path = '/home/lowu/.config/kitty/colors/matugen.conf'
# ...
[templates.waybar]
input_path = '/home/lowu/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/colors/matugen.css'
post_hook = '~/.config/waybar/scripts/launch.sh'
# ...
[templates.gtk3]
input_path = '/home/lowu/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme "Graphite-Dark"'

[templates.gtk4]
input_path = '/home/lowu/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
post_hook = '~/.config/matugen/post-hook-scripts/gtk-themes-reload.sh'
# ...
[templates.hyprland]
input_path = '/home/lowu/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/colors/matugen.lua' # If using lua config replace *.conf* with *.lua* at the end
# ...
[templates.pywalfox]
input_path = '/home/lowu/.config/matugen/templates/pywalfox-colors.json'
output_path = '~/.cache/wal/colors.json'
post_hook = 'pywalfox update'
# ...
[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.local/share/rofi/colors/matugen.rasi'
# ...
[templates.wlogout]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/wlogout/colors/matugen.css'
# ...
[templates.swaync]
input_path = '~/.config/matugen/templates/swaync-colors.css'
output_path = '~/.config/swaync/tokens/variables.css'
# ...
[templates.rmpc]
input_path = '~/.config/matugen/templates/rmpc-template.ron'
output_path = '~/.config/rmpc/themes/theme.ron'
# ...
[templates.discord]
input_path = '~/.config/matugen/templates/discord-template.css'
output_path = '~/.config/vesktop/themes/matugen.css'